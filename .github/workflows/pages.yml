name: Deploy Voice Memory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        name: Detect whether Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          api_url="https://api.github.com/repos/${{ github.repository }}"
          status=$(curl -sS -o /tmp/repo.json -w '%{http_code}' \
            -u "x-access-token:${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${api_url}")
          if [ "$status" != "200" ]; then
            cat /tmp/repo.json
            echo "Unexpected response querying repository metadata: HTTP $status" >&2
            exit 1
          fi
          has_pages=$(python -c "import json; print(json.load(open('/tmp/repo.json')).get('has_pages', False))")
          if [ "$has_pages" = "True" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Verify publish directory
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        run: |
          if [ ! -d voice-memory ]; then
            echo "Expected publish directory 'voice-memory' was not found." >&2
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        with:
          path: voice-memory
      - name: Skip deploy when Pages is not enabled
        if: ${{ steps.pages.outputs.enabled != 'true' }}
        run: echo "GitHub Pages is not enabled for this repository. Enable Pages in repository settings to deploy."
      - id: deployment
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/deploy-pages@v4
