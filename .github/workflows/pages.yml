name: Deploy Voice Memory

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: pages
        name: Detect whether Pages is enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -sS -o /tmp/pages.json -w '%{http_code}' \
            -u "x-access-token:${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "200" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif [ "$status" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            cat /tmp/pages.json
            echo "Unexpected response querying Pages API: HTTP $status" >&2
            exit 1
          fi
      - name: Verify publish directory
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        run: test -d voice-memory
      - uses: actions/upload-pages-artifact@v3
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        with:
          path: voice-memory
      - name: Skip deploy when Pages is not enabled
        if: ${{ steps.pages.outputs.enabled != 'true' }}
        run: echo "GitHub Pages is not enabled for this repository. Enable Pages in repository settings to deploy."
      - id: deployment
        if: ${{ steps.pages.outputs.enabled == 'true' }}
        uses: actions/deploy-pages@v4
